<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能客服与客户运营中台</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <div class="brand-title">客户运营中台</div>
            <div class="brand-subtitle">本地可运行版</div>
          </div>
        </div>
        <nav class="nav" aria-label="主导航">
          <button class="nav-group active" data-nav-group="overview">
            <span>总览</span>
            <span class="nav-chevron">›</span>
          </button>
          <div class="nav-subitems expanded" data-nav-panel="overview">
            <button class="nav-item active" data-view="overview" data-nav-group="overview"><span class="nav-dot"></span>运营总览</button>
          </div>

          <button class="nav-group" data-nav-group="telemarketing">
            <span>电销运营</span>
            <span class="nav-chevron">›</span>
          </button>
          <div class="nav-subitems" data-nav-panel="telemarketing">
            <button class="nav-item" data-view="telemarketingOps" data-nav-group="telemarketing" data-nav-preset="telemarketingCustomers"><span class="nav-dot"></span>分析与群发</button>
          </div>

          <button class="nav-group" data-nav-group="sales">
            <span>销售运营</span>
            <span class="nav-chevron">›</span>
          </button>
          <div class="nav-subitems" data-nav-panel="sales">
            <button class="nav-item" data-view="salesOps" data-nav-group="sales" data-nav-preset="salesTasks"><span class="nav-dot"></span>任务与推荐</button>
          </div>

          <button class="nav-group" data-nav-group="groupchat">
            <span>VIP群维护</span>
            <span class="nav-chevron">›</span>
          </button>
          <div class="nav-subitems" data-nav-panel="groupchat">
            <button class="nav-item" data-view="vipOps" data-nav-group="groupchat" data-nav-preset="vipTasks"><span class="nav-dot"></span>实时维护</button>
          </div>

          <button class="nav-group" data-nav-group="customer">
            <span>客户档案</span>
            <span class="nav-chevron">›</span>
          </button>
          <div class="nav-subitems" data-nav-panel="customer">
            <button class="nav-item" data-view="customers" data-nav-group="customer" data-nav-preset="allCustomers"><span class="nav-dot"></span>全量客户</button>
          </div>

          <button class="nav-group" data-nav-group="settings">
            <span>系统设置</span>
            <span class="nav-chevron">›</span>
          </button>
          <div class="nav-subitems" data-nav-panel="settings">
            <button class="nav-item" data-view="settingsHub" data-nav-group="settings"><span class="nav-dot"></span>业务配置</button>
          </div>
        </nav>
        <div class="sidebar-note">
          <span class="note-label">当前版本</span>
          <strong>三线运营工作台</strong>
          <span>电销做分层群发，销售做优先级任务，VIP群做实时维护。</span>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Customer Journey Operating System</p>
            <h1 id="viewTitle">总览</h1>
          </div>
          <div class="top-actions">
            <button class="ghost-button" id="resetDemo" data-action-button title="恢复初始本地样例数据">重置数据</button>
            <button class="ghost-button" id="runDiagnostics" data-action-button title="检查客户、任务、报价、模板和审计状态">运行系统自检</button>
            <button class="primary-button" id="runDemo" data-action-button title="按当前客户阶段批量运行本地规则Agent">批量运行本地Agent</button>
          </div>
        </header>

        <section id="viewRoot" class="view-root" aria-live="polite"></section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
