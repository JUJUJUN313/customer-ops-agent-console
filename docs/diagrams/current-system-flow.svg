<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">客户运营中台全系统流程图</title>
  <desc id="desc">电销、销售、VIP群维护三条业务线，以及历史消息、任务审批、系统设置和审计回流。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .lane { fill: #ffffff; stroke: #dbe4ef; stroke-width: 1.5; filter: url(#shadow); }
      .lane-title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .lane-note { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; filter: url(#shadow); }
      .box-blue { fill: #eff6ff; stroke: #93c5fd; }
      .box-amber { fill: #fffbeb; stroke: #fbbf24; }
      .box-green { fill: #ecfdf5; stroke: #6ee7b7; }
      .box-red { fill: #fff1f2; stroke: #fda4af; }
      .box-purple { fill: #f5f3ff; stroke: #c4b5fd; }
      .text { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tag { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.1; marker-end: url(#arrow); }
      .line-blue { stroke: #2563eb; marker-end: url(#arrow-blue); }
      .line-amber { stroke: #d97706; marker-end: url(#arrow-amber); }
      .line-green { stroke: #059669; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1220"/>
  <text class="title" x="70" y="68">客户运营中台全系统流程图</text>
  <text class="subtitle" x="70" y="102">电销做分层群发，销售做人机协同任务，VIP群保留实时收发和自动化维护</text>

  <rect class="lane" x="50" y="135" width="1700" height="180" rx="18"/>
  <text class="lane-title" x="82" y="178">数据与分析底座</text>
  <text class="lane-note" x="82" y="205">历史消息是电销/销售分析来源，也是VIP发送补账确认来源</text>

  <rect class="box box-blue" x="90" y="230" width="260" height="58" rx="12"/>
  <text class="text" x="120" y="255">客户基础数据</text>
  <text class="small" x="120" y="276">交易额 / 会员 / 标签 / 型号</text>

  <rect class="box box-blue" x="430" y="220" width="270" height="78" rx="12"/>
  <text class="text" x="465" y="250">统一客户档案</text>
  <text class="small" x="465" y="272">客户阶段、画像、任务和事件</text>

  <rect class="box box-purple" x="790" y="230" width="260" height="58" rx="12"/>
  <text class="text" x="820" y="255">服务商历史消息</text>
  <text class="small" x="820" y="276">企微存档 / 下载记录</text>

  <rect class="box box-purple" x="1110" y="230" width="240" height="58" rx="12"/>
  <text class="text" x="1143" y="255">归档与去重</text>
  <text class="small" x="1143" y="276">按会话、消息ID沉淀</text>

  <rect class="box box-purple" x="1410" y="220" width="285" height="78" rx="12"/>
  <text class="text" x="1440" y="250">摘要 / 意图 / 标签</text>
  <text class="small" x="1440" y="272">提取关键历史、补充画像</text>

  <path class="line line-blue" d="M350 259 H430"/>
  <path class="line" d="M1050 259 H1110"/>
  <path class="line" d="M1350 259 H1410"/>
  <path class="line dash" d="M1410 298 C1160 330, 770 330, 700 270"/>

  <rect class="lane" x="50" y="350" width="520" height="470" rx="18"/>
  <text class="lane-title" x="82" y="393">电销运营</text>
  <text class="lane-note" x="82" y="420">不实时回复，生成分层、群发计划和后台群发任务</text>

  <rect class="box box-amber" x="95" y="455" width="200" height="62" rx="12"/>
  <text class="text" x="126" y="481">电销分析Agent</text>
  <text class="small" x="126" y="502">筛选 / 培育判断</text>

  <rect class="box box-amber" x="325" y="455" width="200" height="62" rx="12"/>
  <text class="text" x="366" y="481">客户分层</text>
  <text class="small" x="352" y="502">高意向 / 培育 / 唤醒</text>

  <rect class="box box-amber" x="95" y="560" width="430" height="70" rx="12"/>
  <text class="text" x="128" y="588">推荐群发批次</text>
  <text class="small" x="128" y="611">名单、筛选条件、排除原因、文案、负责人</text>

  <rect class="box box-red" x="95" y="675" width="190" height="62" rx="12"/>
  <text class="text" x="134" y="702">人工审批</text>
  <text class="small" x="128" y="722">确认名单和文案</text>

  <rect class="box box-amber" x="335" y="675" width="190" height="62" rx="12"/>
  <text class="text" x="362" y="702">创建群发任务</text>
  <text class="small" x="366" y="722">企微后台 / 员工执行</text>

  <path class="line line-amber" d="M295 486 H325"/>
  <path class="line line-amber" d="M425 517 V560"/>
  <path class="line line-amber" d="M310 630 V675"/>
  <path class="line line-amber" d="M285 706 H335"/>

  <rect class="lane" x="640" y="350" width="520" height="470" rx="18"/>
  <text class="lane-title" x="672" y="393">销售运营</text>
  <text class="lane-note" x="672" y="420">系统只下发任务和推荐回复，销售本人在企微里发送</text>

  <rect class="box box-green" x="685" y="455" width="200" height="62" rx="12"/>
  <text class="text" x="716" y="481">销售承接Agent</text>
  <text class="small" x="714" y="502">意向 / 异议 / 会员卡</text>

  <rect class="box box-green" x="915" y="455" width="200" height="62" rx="12"/>
  <text class="text" x="956" y="481">意向判断</text>
  <text class="small" x="940" y="502">报价 / 付款 / 暂缓</text>

  <rect class="box box-green" x="685" y="560" width="200" height="70" rx="12"/>
  <text class="text" x="721" y="588">销售任务队列</text>
  <text class="small" x="714" y="611">优先级、原因、SLA</text>

  <rect class="box box-green" x="915" y="560" width="200" height="70" rx="12"/>
  <text class="text" x="952" y="588">销售辅助信息</text>
  <text class="small" x="941" y="611">摘要、记录、推荐回复</text>

  <rect class="box box-green" x="685" y="675" width="430" height="62" rx="12"/>
  <text class="text" x="735" y="702">企微应用 / 侧边栏展示</text>
  <text class="small" x="735" y="722">客户信息、参考记录、推荐回复、下一步动作</text>

  <rect class="box box-green" x="760" y="760" width="280" height="45" rx="12"/>
  <text class="text" x="798" y="789">销售人工回复客户</text>

  <path class="line line-green" d="M885 486 H915"/>
  <path class="line line-green" d="M1015 517 V560"/>
  <path class="line line-green" d="M785 630 V675"/>
  <path class="line line-green" d="M1015 630 V675"/>
  <path class="line line-green" d="M900 737 V760"/>

  <rect class="lane" x="1230" y="350" width="520" height="470" rx="18"/>
  <text class="lane-title" x="1262" y="393">VIP群维护</text>
  <text class="lane-note" x="1262" y="420">唯一保留实时读取和自动化发送的业务线</text>

  <rect class="box box-blue" x="1268" y="455" width="205" height="62" rx="12"/>
  <text class="text" x="1303" y="481">本地企微Worker</text>
  <text class="small" x="1295" y="502">未读识别 / 批量读取</text>

  <rect class="box box-blue" x="1505" y="455" width="205" height="62" rx="12"/>
  <text class="text" x="1538" y="481">标准入站消息</text>
  <text class="small" x="1530" y="502">roomId / messageId</text>

  <rect class="box box-blue" x="1268" y="560" width="205" height="62" rx="12"/>
  <text class="text" x="1312" y="586">VIP分流Agent</text>
  <text class="small" x="1295" y="607">售前 / 售后 / 报价 / 投诉</text>

  <rect class="box box-red" x="1505" y="560" width="205" height="62" rx="12"/>
  <text class="text" x="1545" y="586">风险判断</text>
  <text class="small" x="1538" y="607">低风险队列 / 高风险确认</text>

  <rect class="box box-blue" x="1268" y="675" width="205" height="62" rx="12"/>
  <text class="text" x="1302" y="702">自动回复队列</text>
  <text class="small" x="1302" y="722">SendScheduler</text>

  <rect class="box box-blue" x="1505" y="675" width="205" height="62" rx="12"/>
  <text class="text" x="1532" y="702">发送前防漏读</text>
  <text class="small" x="1532" y="722">快读尾部 / 版本校验</text>

  <rect class="box box-blue" x="1268" y="760" width="442" height="45" rx="12"/>
  <text class="text" x="1334" y="789">企微员工客户端自动化发送并补账确认</text>

  <path class="line line-blue" d="M1473 486 H1505"/>
  <path class="line line-blue" d="M1608 517 V545 C1608 555, 1490 555, 1473 580"/>
  <path class="line line-blue" d="M1473 591 H1505"/>
  <path class="line line-blue" d="M1505 591 C1480 642, 1436 664, 1390 675"/>
  <path class="line line-blue" d="M1473 706 H1505"/>
  <path class="line line-blue" d="M1608 737 V760"/>
  <path class="line line-blue dash" d="M1505 612 C1435 642, 1360 640, 1320 622"/>

  <rect class="lane" x="50" y="875" width="1700" height="250" rx="18"/>
  <text class="lane-title" x="82" y="918">统一审批、系统设置与审计回流</text>
  <text class="lane-note" x="82" y="945">所有外部动作都有任务状态、客户事件和审计记录，不把界面状态伪装成真实执行</text>

  <rect class="box box-red" x="130" y="990" width="330" height="70" rx="12"/>
  <text class="text" x="178" y="1019">任务与审批中心</text>
  <text class="small" x="178" y="1042">群发审批 / 销售任务 / 高风险确认 / SLA</text>

  <rect class="box box-purple" x="575" y="990" width="330" height="70" rx="12"/>
  <text class="text" x="642" y="1019">系统设置</text>
  <text class="small" x="642" y="1042">模型 / 企微状态 / 历史消息 / 风控 / 自检</text>

  <rect class="box" x="1020" y="990" width="330" height="70" rx="12"/>
  <text class="text" x="1078" y="1019">客户事件与审计日志</text>
  <text class="small" x="1078" y="1042">任务结果、发送回执、补账确认全部回流</text>

  <rect class="box box-blue" x="1465" y="990" width="220" height="70" rx="12"/>
  <text class="text" x="1514" y="1019">客户档案回写</text>
  <text class="small" x="1502" y="1042">标签、阶段、任务、结果更新</text>

  <path class="line" d="M190 737 C190 830, 260 895, 295 990"/>
  <path class="line" d="M785 630 C770 815, 520 880, 330 990"/>
  <path class="line" d="M1608 622 C1590 830, 820 870, 360 990"/>
  <path class="line" d="M460 1025 H575"/>
  <path class="line" d="M905 1025 H1020"/>
  <path class="line" d="M1350 1025 H1465"/>
  <path class="line dash" d="M1575 990 C1500 875, 765 360, 570 298"/>
  <path class="line dash" d="M1185 990 C1130 860, 1015 815, 920 805"/>
  <path class="line dash" d="M1465 1060 C1220 1150, 710 1135, 565 298"/>

  <path class="line dash" d="M565 298 C430 360, 300 400, 195 455"/>
  <path class="line dash" d="M565 298 C640 360, 710 405, 785 455"/>
  <path class="line dash" d="M565 298 C965 360, 1180 395, 1370 455"/>

  <rect x="70" y="1150" width="1660" height="1.5" fill="#e2e8f0"/>
  <text class="small" x="70" y="1182">边界：电销不实时回复；销售不自动发送；VIP群低风险可自动排队发送，高风险必须人工确认；历史消息用于分析和补账。</text>
</svg>
